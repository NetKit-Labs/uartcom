name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit, regression, and Python baud tests
        run: make test

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm GNU toolchain
        run: |
          set -euo pipefail
          url="https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz"
          curl -fsSL -o /tmp/arm-gcc.tar.gz "$url"
          mkdir -p "$HOME/toolchain"
          tar -xzf /tmp/arm-gcc.tar.gz -C "$HOME/toolchain"
          echo "$HOME/toolchain/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin" >> "$GITHUB_PATH"
      - name: Build firmware
        run: make firmware

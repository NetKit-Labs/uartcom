name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select a C++23 host compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          pick=""
          for cxx in c++ g++ g++-15 g++-14 g++-13; do
            if ! command -v "$cxx" >/dev/null 2>&1; then
              continue
            fi
            value=$(printf '%s\n' 'int main(){}' | "$cxx" -std=c++23 -dM -E -xc++ - 2>/dev/null | awk '$2=="__cplusplus"{print $3+0}')
            if [ "${value:-0}" -ge 202302 ]; then
              pick=$cxx
              break
            fi
          done
          if [ -z "$pick" ]; then
            sudo apt-get install -y g++-14
            pick=g++-14
          fi
          echo "HOST_CXX=$pick" >> "$GITHUB_ENV"
          "$pick" --version
      - name: Unit, regression, and Python baud tests
        run: make test

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Arm GNU toolchain
        run: |
          set -euo pipefail
          url="https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz"
          curl -fsSL -o /tmp/arm-gcc.tar.gz "$url"
          mkdir -p "$HOME/toolchain"
          tar -xzf /tmp/arm-gcc.tar.gz -C "$HOME/toolchain"
          echo "$HOME/toolchain/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin" >> "$GITHUB_PATH"
      - name: Build firmware
        run: make firmware

  cppcheck:
      name: Cppcheck static analysis
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v4
        - name: Install Cppcheck
          run: sudo apt-get update && sudo apt-get install -y cppcheck
        - name: Analyze project-owned C/C++ sources
          run: |
            cppcheck --error-exitcode=1 --quiet --enable=warning,performance,portability \
              --inline-suppr --suppress=missingIncludeSystem \
            --suppress=passedByValue --suppress=uninitvar:include/uartcom/protocol.hpp \
            --suppress=comparePointers:firmware/src/startup.cpp \
            --suppress=arithOperationsOnVoidPointer:firmware/src/startup.cpp --std=c++20 \
              -Iinclude -Ifirmware/include include firmware/src tests
